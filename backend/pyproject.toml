[project]
name = "temanbelajar-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "numpy>=2,<3", "scipy>=1.15,<2", "tzdata>=2025.1"]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2,<4",
    "pytest>=8,<10",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
